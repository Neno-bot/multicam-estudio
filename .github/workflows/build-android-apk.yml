name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar MultiCam Studio APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generar estructura Gradle de Android conservando permisos
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android --project-name multicam_studio --org com.multicam.studio
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

          # Actualizar Gradle 8.7, AGP 8.6.0, Kotlin 2.1.0, compileSdk 35 y minSdk 23
          python3 - << 'PYEOF'
          import os, re

          def patch(path, replacements):
              if not os.path.exists(path):
                  return
              with open(path, 'r', encoding='utf-8') as f:
                  text = f.read()
              for pattern, repl in replacements:
                  text = re.sub(pattern, repl, text)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              print(f'Patched: {path}')

          patch('android/gradle/wrapper/gradle-wrapper.properties', [
              (r'gradle-[0-9.]+-(all|bin)\.zip', 'gradle-8.7-all.zip'),
          ])

          for sfile in ('android/settings.gradle', 'android/settings.gradle.kts'):
              patch(sfile, [
                  (r'(com\.android\.application["\'\)\s]+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.6.0\2'),
                  (r'(org\.jetbrains\.kotlin\.android["\'\)\s]+version\s+["\'])[^"\']+(["\'])', r'\g<1>2.1.0\2'),
              ])

          for bfile in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              patch(bfile, [
                  (r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35'),
                  (r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 35'),
                  (r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23'),
                  (r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23'),
              ])
          PYEOF

          # Reglas ProGuard/R8 para preservar clases JNI de WebRTC y MLKit
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class org.webrtc.** { *; }
          -dontwarn org.webrtc.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          EOF

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Ejecutar pruebas automatizadas
        run: flutter test

      - name: Compilar APK Release para Android
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MultiCam-Studio.apk

      - name: Subir APK como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: MultiCam-Studio-Android-APK
          path: build/app/outputs/flutter-apk/MultiCam-Studio.apk
          retention-days: 30

      - name: Publicar enlace directo de descarga en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android-test
          name: MultiCam Studio (Última compilación Android)
          body: |
            Descarga e instala `MultiCam-Studio.apk` directamente en tu **Teléfono Android** (Modo Cámara) y tu **Tablet Android** (Modo Director).
            Ambos dispositivos deben estar conectados a la misma red Wi-Fi local.
          files: build/app/outputs/flutter-apk/MultiCam-Studio.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
