name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar MultiCam Studio APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generar estructura Gradle de Android conservando permisos
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android --project-name multicam_studio --org com.multicam.studio
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

          # Asegurar minSdk >= 23 para flutter_webrtc y mobile_scanner
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          fi

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Ejecutar pruebas automatizadas
        run: flutter test

      - name: Compilar APK Release para Android
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MultiCam-Studio.apk

      - name: Subir APK como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: MultiCam-Studio-Android-APK
          path: build/app/outputs/flutter-apk/MultiCam-Studio.apk
          retention-days: 30

      - name: Publicar enlace directo de descarga en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android-test
          name: MultiCam Studio (Última compilación Android)
          body: |
            Descarga e instala `MultiCam-Studio.apk` directamente en tu **Teléfono Android** (Modo Cámara) y tu **Tablet Android** (Modo Director).
            Ambos dispositivos deben estar conectados a la misma red Wi-Fi local.
          files: build/app/outputs/flutter-apk/MultiCam-Studio.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
