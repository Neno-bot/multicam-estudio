name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar NenoCam Studio APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generar estructura Android, RTMP RootEncoder, icono NenoCam Studio y firma Release
        run: |
          # Respaldar Manifest y código Kotlin nativo (RTMP YouTube/Facebook)
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          mkdir -p /tmp/kotlin_backup
          cp -r android/app/src/main/kotlin/com/multicam/studio/multicam_studio/* /tmp/kotlin_backup/

          flutter create . --platforms=android --project-name multicam_studio --org com.multicam.studio

          # Restaurar Manifest y código Kotlin nativo
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/multicam/studio/multicam_studio
          cp -r /tmp/kotlin_backup/* android/app/src/main/kotlin/com/multicam/studio/multicam_studio/
          rm -f test/widget_test.dart

          # 1. Generar firma Release válida (v1 + v2) para Android 14/15
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -alias nenocam \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nenocam_release_key \
            -keypass nenocam_release_key \
            -dname "CN=NenoCam Studio, OU=LiveProduction, O=NenoCam, L=Local, ST=Local, C=US"

          # 2. Instalar icono profesional NenoCam Studio en todas las densidades Android
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages -q pillow
          python3 - << 'ICONEOF'
          import os
          from PIL import Image

          src = 'assets/icon/app_icon.png'
          if os.path.exists(src):
              img = Image.open(src).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              for folder, size in sizes.items():
                  out_dir = os.path.join('android/app/src/main/res', folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, 'ic_launcher.png'), 'PNG')
              print('Custom launcher icons generated successfully.')
          ICONEOF

          # 3. Fondo oscuro profesional de arranque (#0B0E14)
          for bg in android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml; do
            if [ -f "$bg" ]; then
              cat << 'BGEOF' > "$bg"
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <color android:color="#0B0E14" />
              </item>
          </layer-list>
          BGEOF
            fi
          done

          # 4. Actualizar Gradle 8.7, AGP 8.6.0, Kotlin 2.1.0, JitPack + RootEncoder 2.5.4,
          #    compileSdk 35, minSdk 23, useLegacyPackaging y firma Release + R8
          python3 - << 'PYEOF'
          import os, re

          def patch(path, replacements):
              if not os.path.exists(path):
                  return
              with open(path, 'r', encoding='utf-8') as f:
                  text = f.read()
              for pattern, repl in replacements:
                  text = re.sub(pattern, repl, text, flags=re.DOTALL)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              print(f'Patched: {path}')

          patch('android/gradle/wrapper/gradle-wrapper.properties', [
              (r'gradle-[0-9.]+-(all|bin)\.zip', 'gradle-8.7-all.zip'),
          ])

          for sfile in ('android/settings.gradle', 'android/settings.gradle.kts'):
              patch(sfile, [
                  (r'(com\.android\.application["\'\)\s]+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.6.0\2'),
                  (r'(org\.jetbrains\.kotlin\.android["\'\)\s]+version\s+["\'])[^"\']+(["\'])', r'\g<1>2.1.0\2'),
              ])

          # Añadir repositorio JitPack para RootEncoder (RTMP / RTMPS)
          patch('android/build.gradle', [
              (r'(allprojects\s*\{\s*repositories\s*\{)', r'\1\n        maven { url "https://jitpack.io" }'),
          ])

          groovy_release_block = '''    signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storePassword "nenocam_release_key"
                      keyAlias "nenocam"
                      keyPassword "nenocam_release_key"
                      enableV1Signing true
                      enableV2Signing true
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }'''

          patch('android/app/build.gradle', [
              (r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.nenocam.studio"'),
              (r'applicationId\s+"[^"]+"', 'applicationId "com.nenocam.studio"'),
              (r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35'),
              (r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 35'),
              (r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23'),
              (r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23'),
              (r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34'),
              (r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34'),
              (r'buildTypes\s*\{\s*release\s*\{.*?\}\s*\}', groovy_release_block),
          ])

          # Añadir dependencia RootEncoder en android/app/build.gradle
          with open('android/app/build.gradle', 'r', encoding='utf-8') as f:
              app_gradle = f.read()
          if 'RootEncoder' not in app_gradle:
              app_gradle += '\ndependencies {\n    implementation "com.github.pedroSG94.RootEncoder:library:2.5.4"\n}\n'
              with open('android/app/build.gradle', 'w', encoding='utf-8') as f:
                  f.write(app_gradle)
          PYEOF

          # 5. Reglas ProGuard/R8 completas para WebRTC, RootEncoder RTMP, QR y mDNS
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class org.webrtc.** { *; }
          -dontwarn org.webrtc.**
          -keep class com.cloudwebrtc.webrtc.** { *; }
          -dontwarn com.cloudwebrtc.webrtc.**
          -keep class com.pedro.** { *; }
          -dontwarn com.pedro.**
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -dontwarn dev.steenbakker.mobile_scanner.**
          -keep class fr.skyost.bonsoir.** { *; }
          -dontwarn fr.skyost.bonsoir.**
          -keep class com.baseflow.permissionhandler.** { *; }
          -keep class dev.fluttercommunity.plus.** { *; }
          EOF

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Ejecutar pruebas automatizadas
        run: flutter test

      - name: Compilar APKs ligeros de NenoCam Studio (ARM64 + ARMv7)
        run: |
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/NenoCam-Studio-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/NenoCam-Studio-armv7.apk

      - name: Firmar con v1 + v2 + v3 (Samsung One UI 7 / Android 15+) y verificar APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/NenoCam-Studio-arm64.apk build/app/outputs/flutter-apk/NenoCam-Studio-armv7.apk; do
            "$APKSIGNER" sign \
              --ks android/app/release.jks \
              --ks-key-alias nenocam \
              --ks-pass pass:nenocam_release_key \
              --key-pass pass:nenocam_release_key \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Subir APKs como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: NenoCam-Studio-Android-APKs
          path: |
            build/app/outputs/flutter-apk/NenoCam-Studio-arm64.apk
            build/app/outputs/flutter-apk/NenoCam-Studio-armv7.apk
          retention-days: 30

      - name: Publicar enlaces directos en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-android-test >/dev/null 2>&1; then
            gh release edit latest-android-test \
              --title "NenoCam Studio v1.2.1 (Fix Samsung S24 FE / One UI 7)" \
              --notes "Descarga NenoCam-Studio-arm64.apk para teléfonos Samsung Galaxy S24 FE y Android 64-bit (ID com.nenocam.studio, firma v1+v2+v3)." \
              --latest
            gh release upload latest-android-test \
              build/app/outputs/flutter-apk/NenoCam-Studio-arm64.apk \
              build/app/outputs/flutter-apk/NenoCam-Studio-armv7.apk \
              --clobber
          else
            gh release create latest-android-test \
              build/app/outputs/flutter-apk/NenoCam-Studio-arm64.apk \
              build/app/outputs/flutter-apk/NenoCam-Studio-armv7.apk \
              --title "NenoCam Studio v1.2.1 (Fix Samsung S24 FE / One UI 7)" \
              --notes "Descarga NenoCam-Studio-arm64.apk para teléfonos Samsung Galaxy S24 FE y Android 64-bit (ID com.nenocam.studio, firma v1+v2+v3)." \
              --latest
          fi
