name: multicam_studio
description: NenoCam Studio — Aplicación multicámara de producción en vivo con YouTube/Facebook Live, imágenes y videos.
publish_to: 'none'
version: 1.7.1+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Streaming WebRTC P2P de baja latencia
  flutter_webrtc: ^0.12.0

  # Descubrimiento mDNS en red Wi-Fi local (complementa UDP Broadcast nativo)
  bonsoir: ^5.1.10

  # Gestión de estado reactiva
  provider: ^6.1.2

  # Permisos de cámara, micrófono y notificaciones
  permission_handler: ^11.3.1

  # Obtención de IP local Wi-Fi
  network_info_plus: ^6.0.2

  # Mantener pantalla encendida durante producción en vivo
  wakelock_plus: ^1.2.8

  # Identificadores únicos por cámara
  uuid: ^4.5.1

  # Emparejamiento QR / Escáner y grabación local
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  path_provider: ^2.1.4

  # v1.2-v1.5: Imágenes, videos locales, overlays PNG/GIF/WebM y actualizaciones
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  video_player: ^2.9.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
